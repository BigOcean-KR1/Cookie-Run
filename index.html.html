<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>COOKIE CLEAN-UP — 노담 런</title>
<style>
:root{--gold:#ffd23c;--green:#9be29b}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#0a0820;font-family:'Trebuchet MS',sans-serif;touch-action:none;user-select:none}
canvas{display:block;width:100%;height:100%}
#hud{position:absolute;top:0;left:0;right:0;padding:12px;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:6px}
#hpRow{display:flex;align-items:center;gap:8px}
#heart{font-size:26px;filter:drop-shadow(0 2px 0 rgba(0,0,0,.5))}
#hpWrap{width:min(62vw,520px);height:22px;background:rgba(0,0,0,.45);border-radius:12px;overflow:hidden;border:3px solid rgba(255,255,255,.8);box-shadow:0 3px 8px rgba(0,0,0,.4)}
#hp{height:100%;width:100%;background:linear-gradient(90deg,#ff5e3a,#ffb33a,#ffe14d);background-size:200% 100%;transition:width .12s;animation:flow 1.5s linear infinite}
@keyframes flow{to{background-position:200% 0}}
#scoreRow{display:flex;align-items:center;gap:8px;font-weight:bold;font-size:30px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.5),0 0 14px rgba(150,226,155,.6)}
#scoreRow .ic{font-size:24px}
#banner{position:absolute;top:38%;left:0;right:0;text-align:center;font-size:54px;font-weight:bold;font-style:italic;color:#ffe14d;text-shadow:0 0 30px #ff9e3c,0 6px 0 #a85a00;letter-spacing:3px;opacity:0;pointer-events:none;transition:opacity .3s}
#banner.show{animation:pop .9s ease}
@keyframes pop{0%{transform:scale(.4);opacity:0}30%{transform:scale(1.15);opacity:1}80%{opacity:1}100%{transform:scale(1);opacity:.9}}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;z-index:5;color:#fff;background:radial-gradient(circle at 50% 30%,#1c3a2a,#0a1810)}
.screen h1{font-size:46px;color:var(--gold);text-shadow:0 0 24px #6fd06f,0 5px 0 #2a5a2a;font-style:italic;letter-spacing:1px}
.screen p{margin:14px 22px 20px;font-size:15px;line-height:1.7;opacity:.92;max-width:560px}
.screen button{font-family:inherit;font-size:22px;font-weight:bold;padding:14px 48px;border:0;border-radius:16px;background:var(--gold);color:#2a5a2a;cursor:pointer;box-shadow:0 6px 0 #c79a14;transition:transform .08s;margin-top:4px}
.screen button:active{transform:translateY(5px);box-shadow:none}
.hidden{display:none!important}
#picks{display:flex;gap:22px;margin:18px 0 26px;flex-wrap:wrap;justify-content:center}
.pick{width:150px;background:rgba(255,255,255,.08);border:3px solid rgba(255,255,255,.18);border-radius:20px;padding:14px 10px;cursor:pointer;transition:.15s}
.pick:hover{transform:translateY(-4px)}
.pick.sel{border-color:var(--gold);background:rgba(255,210,60,.16);box-shadow:0 0 24px rgba(255,210,60,.5)}
.pick img{width:120px;height:120px;object-fit:contain;filter:drop-shadow(0 6px 6px rgba(0,0,0,.5))}
.pick .nm{margin-top:8px;font-weight:bold;font-size:15px}
.pick .dx{font-size:12px;opacity:.7;margin-top:2px}
#ctrl{position:absolute;bottom:0;left:0;right:0;height:42%;display:flex;pointer-events:none;z-index:3}
#ctrl div{flex:1;pointer-events:auto;display:flex;align-items:flex-end;justify-content:center;padding-bottom:18px;color:rgba(255,255,255,.45);font-weight:bold;font-size:15px}
@media (pointer:fine){#ctrl div span{display:none}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud" class="hidden">
  <div id="hpRow"><span id="heart">❤️</span><div id="hpWrap"><div id="hp"></div></div></div>
  <div id="scoreRow"><span class="ic">🧹</span><span id="score">0</span></div>
</div>
<div id="banner"></div>
<div id="ctrl" class="hidden">
  <div id="slideZone"><span>⬇ 슬라이드</span></div>
  <div id="jumpZone"><span>⬆ 점프</span></div>
</div>

<div id="home" class="screen">
  <h1>🧹 COOKIE CLEAN-UP</h1>
  <p>달리면서 길에 버려진 담배꽁초와 쓰레기를 주워 거리를 깨끗하게!<br>장애물은 피하고, 깨끗해질수록 점수가 올라갑니다. <b>#노담</b></p>
  <div id="picks">
    <div class="pick sel" data-c="0">
      <img id="thumb0" alt="미스틱플라워 쿠키">
      <div class="nm">미스틱플라워 쿠키</div><div class="dx">열반에 이른 선각자</div>
    </div>
    <div class="pick" data-c="1">
      <img id="thumb1" alt="쉐도우밀크 쿠키">
      <div class="nm">쉐도우밀크 쿠키</div><div class="dx">진리의 현자</div>
    </div>
  </div>
  <button id="startBtn">청소 시작</button>
  <p style="font-size:13px;opacity:.6;margin-top:14px">
  🖥 ↑·스페이스 점프(2단) / ↓ 슬라이드 &nbsp;|&nbsp; 📱 오른쪽 점프 / 왼쪽 슬라이드<br>
  🚬🥤 쓰레기=점수 (공중 쓰레기는 2단 점프!) · 🛍️비닐봉투=주변 일괄 흡입 · 🧲자석 · 💗하트=회복 · ☀️보너스타임</p>
</div>

<div id="over" class="screen hidden">
  <h1 id="overTitle">🌿 수고했어요!</h1>
  <p id="overMsg"></p>
  <button id="retryBtn">다시 청소</button>
  <button id="homeBtn" style="background:rgba(255,255,255,.2);color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.3);margin-top:12px">캐릭터 변경</button>
</div>

<script src="assets.js"></script>
<script src="game.js"></script>
</body>
</html>
